name: Release v2
on:
  push:
    tags: ["v2.0.0"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset: archaeologist-windows.exe
            path: build/Release/archaeologist.exe
          - os: ubuntu-latest
            asset: archaeologist-linux
            path: build/archaeologist
          - os: macos-latest
            asset: archaeologist-macos
            path: build/archaeologist
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
      - name: Package
        shell: bash
        run: cp "${{ matrix.path }}" "${{ matrix.asset }}"
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: Digital Archaeologist v2.0.0
          prerelease: false
          generate_release_notes: true
          files: ${{ matrix.asset }}
