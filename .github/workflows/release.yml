name: Release v1.1 pre
on:
  push:
    tags:
      - v1.1.0-pre1
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset: archaeologist-windows.exe
          - os: ubuntu-latest
            asset: archaeologist-linux
          - os: macos-latest
            asset: archaeologist-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Package
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then cp build/Release/archaeologist.exe "${{ matrix.asset }}"; else cp build/archaeologist "${{ matrix.asset }}"; chmod +x "${{ matrix.asset }}"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: actions/checkout@v4
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: cp packaging/MacOS release-assets/MacOS. && cp packaging/Linux release-assets/Linux. && chmod +x release-assets/MacOS. release-assets/Linux. && gh release create v1.1.0-pre1 release-assets/* packaging/Windows.bat packaging/MacOS packaging/Linux --title "Digital Archaeologist v1.1.0-pre1" --prerelease --generate-notes
