name: Release v1.2
on:
  push:
    tags:
      - v1.2.0
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare installers
        run: |
          cp packaging/Windows.bat Windows.bat
          cp packaging/MacOS MacOS.
          cp packaging/Linux Linux.
          chmod +x MacOS. Linux.
      - name: Publish installers
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: Digital Archaeologist v1.2.0
          prerelease: true
          generate_release_notes: true
          files: |
            Windows.bat
            MacOS.
            Linux.
        env:
          GITHUB_TOKEN: ${{ github.token }}
  build:
    needs: prepare
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset: archaeologist-windows.exe
          - os: ubuntu-latest
            asset: archaeologist-linux
          - os: macos-latest
            asset: archaeologist-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Package
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then cp build/Release/archaeologist.exe "${{ matrix.asset }}"; else cp build/archaeologist "${{ matrix.asset }}"; fi
      - name: Publish binary
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          prerelease: true
          files: ${{ matrix.asset }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

